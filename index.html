<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="返回项目概览">
      <b>Metal Max 编辑器</b><small>metalmaxcn.nes</small>
    </button>
    <div class="global-build">
      <button class="button primary" id="global-build-run" type="button">构建并运行</button>
      <button class="button" id="global-build-expanded" type="button">构建自检 ROM</button>
      <button class="button" id="global-build-open" type="button">打开模拟器</button>
      <a class="button" href="?view=build"
        title="查看项目状态、每个写入区的构建事件和最终 ROM 字节差异">▤ 项目与构建</a>
    </div>
    <div class="search-container">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="搜索…" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </label>
      <section id="search-results" class="search-results" aria-label="句柄搜索结果" hidden></section>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="navigation" aria-expanded="true" aria-label="收起导航栏" title="收起导航栏">‹</button>
      <nav id="navigation" aria-label="编辑页面"></nav>
      <section class="cache-control" data-cache-control aria-label="缓存控制">
        <button id="sidebar-cache-toggle" type="button" aria-controls="sidebar-cache-content"
          aria-expanded="false" aria-label="展开缓存控制" title="缓存控制">▣</button>
        <div class="cache-control-content" id="sidebar-cache-content">
          <div class="cache-control-heading"><b>缓存</b><small data-cache-total>正在统计…</small></div>
          <div class="cache-control-actions">
            <button type="button" data-cache-fill>填满缓存</button>
            <button type="button" data-cache-cancel hidden>取消</button>
            <button type="button" data-cache-clear="all">清理缓存</button>
          </div>
          <small data-cache-fill-status role="status" hidden></small>
          <details class="cache-control-details">
            <summary>分项清理</summary>
            <div class="cache-control-items">
              <div><b>运行包数据</b><small data-cache-status="package">正在统计…</small>
                <button type="button" data-cache-clear="package" aria-label="清理运行包数据缓存">清理</button></div>
              <div><b>派生预览</b><small data-cache-status="preview">正在统计…</small>
                <button type="button" data-cache-clear="preview" aria-label="清理派生预览缓存">清理</button></div>
            </div>
          </details>
        </div>
      </section>
      <div class="sidebar-foot">
        <span>METAL MAX 项目</span>
        <small>编辑 · 构建 · 运行</small>
      </div>
    </aside>

    <main>
      <section class="page-head">
        <h1 id="view-title">项目概览</h1>
        <p class="eyebrow" id="view-kicker" hidden>PROJECT OVERVIEW</p>
        <div class="head-actions">
          <button type="button" class="button ghost" id="copy-hash" title="复制 SHA-256" aria-label="复制 SHA-256">⧉</button>
          <a class="button primary" href="./package/manifest.json" target="_blank" title="资产清单" aria-label="资产清单">↗</a>
        </div>
        </section>


      <section class="page-body" id="content" aria-live="polite">
        <div class="loading"><span></span>正在装载资产包…</div>
        </section>
    </main>

  </div>

  <footer class="statusbar" id="statusbar" tabindex="0" aria-label="全局状态，点击查看日志">
    <span id="status-tasks" role="status"></span>
    <span id="status-message" role="status" hidden></span>
    <button type="button" id="status-dismiss" aria-label="关闭状态消息" title="关闭状态消息" hidden>×</button>
    <span id="status-rows">—</span>
    <span id="status-selection"></span>
    <span id="status-dirty" class="status-dirty"></span>
    <span id="status-address" class="mono"></span>
  </footer>

  <template id="empty-template">
    <div class="empty">
      <b>暂无匹配资产</b>
    </div>
  </template>
  <script type="module" src="./js/main-D955329O.js"></script>
</body>
